name: Daily Report

# El disparo lo hace un cron externo (cron-job.org) via workflow_dispatch, no el
# scheduler de GitHub. Medido en este repo con 7 ejecuciones del cron '0 7 * * *'
# (23-29 jul 2026): arrancaron entre +2 h 05 min y +3 h 49 min tarde, sin patron.
# Ese jitter movia la hora de entrega casi dos horas de un dia a otro.
# Ver SETUP.md > "Por que no hay cron de GitHub".
#
# El bloque `schedule` de abajo NO es la entrega: es una red de seguridad. El
# 2026-08-13 Shopify devolvio 402 "Unavailable Shop" a las 09:01 y el reporte de
# ese dia se perdio entero, porque un fallo a las 09:00 no tenia segunda
# oportunidad. Los reintentos de src/http.js cubren un hueco de ~1 min; estos dos
# disparos cubren una caida de horas. El jitter del scheduler (las 2-3 h medidas)
# da igual aqui: a un backstop solo se le pide que ocurra el mismo dia.
# El primer paso corta si ya hubo un reporte correcto hoy, asi que en un dia
# normal estas ejecuciones no publican nada.
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Override report date (YYYY-MM-DD). Leave empty for yesterday.'
        required: false
      dry_run:
        description: 'Poner a 1 para imprimir el reporte en el log sin publicarlo en Slack.'
        required: false
        default: ''
  schedule:
    - cron: '0 10 * * *'   # ~12:00 Madrid en verano
    - cron: '0 13 * * *'   # ~15:00 Madrid en verano

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Solo aplica a los disparos programados. Un workflow_dispatch (el cron
      # externo, que entra a las 09:00 UTC = 11:00 Madrid, o alguien a mano)
      # siempre se ejecuta.
      - name: Comprobar si el reporte de hoy ya salio bien
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # En UTC porque `createdAt` viene en UTC. Los disparos van de las 09:00
          # a las 16:00 UTC, franja en la que la fecha UTC y la de Madrid
          # coinciden siempre, asi que no hace falta convertir.
          today=$(date -u +%F)
          ok=$(gh run list --workflow=daily-report.yml --status=success \
                 --limit 40 --json createdAt \
                 --jq "[.[] | select(.createdAt | startswith(\"$today\"))] | length")
          echo "Ejecuciones correctas hoy ($today): $ok"
          if [ "$ok" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "El reporte de hoy ya se publico. No se hace nada."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No hay reporte correcto hoy todavia — reintentando."
          fi

      # Los tres disparos del dia comparten diagnostico: si falla la entrega, los
      # respaldos fallan igual y publicar tres avisos identicos solo entierra el
      # mensaje (paso el 15-ago de 2026). Avisan la entrega y el respaldo FINAL; el
      # intermedio reintenta callado. Si cron-job.org no llegara a disparar, el
      # respaldo final sigue avisando, asi que el canal nunca se queda mudo.
      - name: Decidir si este intento avisa en Slack
        id: aviso
        run: |
          echo "alert=${{ github.event_name != 'schedule' || github.event.schedule == '0 13 * * *' }}" >> "$GITHUB_OUTPUT"
          echo "label=${{ github.event_name != 'schedule' && 'entrega' || (github.event.schedule == '0 13 * * *' && 'respaldo final' || 'respaldo intermedio') }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm install

      - name: Run tests
        if: steps.guard.outputs.skip != 'true'
        run: npm test

      - name: Run daily report
        if: steps.guard.outputs.skip != 'true'
        env:
          # --- Requeridas (configurar en Settings > Secrets) ---
          STORE_NAME: ${{ secrets.STORE_NAME }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

          # --- Zonas horarias y frescura (medidos 2026-07-29, no copiados) ------
          # Cuenta de Meta "EASY_02": timezone_name=Europe/Madrid,
          # timezone_offset_hours_utc=+2. El dia cierra a las 00:00 Madrid, que en
          # verano son 22:00 UTC y en invierno 23:00 UTC.
          # La tienda (SKIN+ EUR) tambien esta en Europe/Madrid: iana_timezone.
          # Entrega a las 11:00 Madrid = 11 h despues del cierre, muy por encima
          # del minimo. Como cuenta, tienda y lector comparten zona, el DST se
          # cancela y las 11:00 de Madrid son siempre 11 h post-cierre.
          META_ACCOUNT_TIMEZONE: 'Europe/Madrid'
          STORE_TIMEZONE: 'Europe/Madrid'
          MIN_HOURS_AFTER_CLOSE: '3'
          # Hora REAL de entrega, medida: el dispatch de cron-job.org entra a las
          # 09:00 UTC, que son las 11:00 de Madrid (el log lo confirma: "cerro hace
          # 11.01 h"). Estuvo puesto en '9:00 (Madrid)' y era falso. Se queda a las
          # 11:00 a proposito: 11 h post-cierre consolidan el gasto de Meta mejor
          # que 9 h, y el minimo exigido son 3 h.
          REPORT_TIME_LABEL: '11:00 (Madrid)'

          # --- Politica de avisos (ver el paso "Decidir si este intento avisa") ---
          ALERT_ON_FAILURE: ${{ steps.aviso.outputs.alert }}
          ATTEMPT_LABEL: ${{ steps.aviso.outputs.label }}

          # --- Monedas (medidas 2026-07-29) ------------------------------------
          # Shopify factura en EUR; la cuenta de Meta gasta en USD. NO coinciden:
          # el gasto, el CPO y el revenue atribuido salen en USD y solo el gasto se
          # convierte a EUR para poder cruzarlo con el revenue en el MER-ROAS.
          STORE_CURRENCY: '€'
          STORE_CURRENCY_CODE: 'EUR'
          AD_CURRENCY: '$'
          AD_CURRENCY_CODE: 'USD'

          # --- Presentacion ----------------------------------------------------
          # La tienda es EUR y primary_locale=es, asi que formato europeo.
          STORE_LOCALE: 'es-ES'
          # STORE_INDUSTRY: ''
          # ROAS_BENCHMARK: ''
          # META_API_VERSION: 'v26.0'
          # SHOPIFY_API_VERSION: '2026-07'
          # CLAUDE_MODEL: 'claude-sonnet-4-6'
          # SUBSCRIPTION_TAGS: '[{"tag":"Kaching Subscription First Order","label":"1ª Susc"},{"tag":"appstle_subscription_recurring_order","label":"Recurrentes"}]'
          REPORT_DATE: ${{ github.event.inputs.report_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node src/report.js
