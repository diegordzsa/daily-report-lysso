name: Diagnostico Temporal

# TEMPORAL — Fase 1/4. Solo lee APIs y loguea. NO escribe en Slack (DRY_RUN=1).
# Borrar cuando termine el diagnostico.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = solo APIs | dryrun = pipeline completo sin publicar'
        required: false
        default: 'dryrun'
      report_date:
        description: 'Fecha a reportar (YYYY-MM-DD). Vacio = ayer.'
        required: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Probe de APIs (timezone, moneda, consolidado)
        if: ${{ github.event.inputs.mode == 'probe' }}
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: node diag.js

      - name: Pipeline completo en DRY_RUN (no publica en Slack)
        if: ${{ github.event.inputs.mode != 'probe' }}
        env:
          DRY_RUN: '1'
          STORE_NAME: ${{ secrets.STORE_NAME }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          META_ACCOUNT_TIMEZONE: 'Europe/Madrid'
          STORE_TIMEZONE: 'Europe/Madrid'
          MIN_HOURS_AFTER_CLOSE: '3'
          REPORT_TIME_LABEL: '9:00 (Madrid)'
          STORE_CURRENCY: '€'
          STORE_CURRENCY_CODE: 'EUR'
          AD_CURRENCY: '$'
          AD_CURRENCY_CODE: 'USD'
          STORE_LOCALE: 'es-ES'
          REPORT_DATE: ${{ github.event.inputs.report_date }}
        run: node src/report.js
