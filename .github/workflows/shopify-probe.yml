name: Shopify Probe

# Solo lee la API de Shopify y loguea. NO publica en Slack.
# Sirve para distinguir un 402 "Unavailable Shop" (tienda congelada) de un token
# revocado o un dominio mal escrito, que desde el log del reporte no se separan.
on:
  workflow_dispatch:
    inputs:
      probe_date:
        description: 'Fecha para contar ordenes (YYYY-MM-DD). Vacio = no cuenta.'
        required: false
      # Sirve para comprobar contra la tienda real si una version nueva sigue
      # sirviendo `orders.json` ANTES de fijarla en el reporte: la REST Admin API
      # es legacy desde octubre de 2024 y sus endpoints van cayendo por version.
      api_version:
        description: 'Version de la Admin API a probar (ej. 2026-07). Vacio = la del codigo.'
        required: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Probe de estado de Shopify
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          PROBE_DATE: ${{ github.event.inputs.probe_date }}
          SHOPIFY_API_VERSION: ${{ github.event.inputs.api_version }}
        run: node shopify-probe.js
